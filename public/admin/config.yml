backend:
  name: github
  repo: cppuix/personal-website
  branch: main
  base_url: https://alqaddari.vercel.app
  auth_endpoint: /api/auth/start

media_folder: "public/uploads"
public_folder: "/uploads"

collections:
  # Books (already working)
  - name: "books"
    label: "Books"
    label_singular: "Book"
    folder: "src/content/books"
    create: true
    delete: true
    extension: "json"
    format: "json"
    identifier_field: "title"
    summary: "{{title}} — {{author}}"
    fields:
      - { label: "Title",           name: "title",         widget: "string" }
      - { label: "Author",          name: "author",        widget: "string" }
      - { label: "Description",     name: "description",   widget: "text",    required: false }
      - { label: "Category",        name: "category",      widget: "select",
          options: ["aqeedah","fiqh","hadith","tafsir","seerah","manhaj","fitan","translations","other"] }
      - { label: "Language",        name: "language",      widget: "select",
          options: ["ar","en","mixed"] }
      - { label: "File Size",       name: "size",          widget: "string",  required: false }
      - { label: "PDF URL",         name: "pdfUrl",        widget: "string",
          hint: "Direct link to the PDF file (e.g. from Archive.org)" }
      - { label: "Cover Image URL", name: "coverImage",    widget: "string",  required: false,
          hint: "Direct link to a cover image (JPEG/PNG) from Archive.org or elsewhere" }
      - { label: "Archive.org page",name: "archiveUrl",    widget: "string",  required: false,
          hint: "Link to the item page on Archive.org" }
      - { label: "Featured",        name: "featured",      widget: "boolean", default: false }

  # Projects
  - name: "projects"
    label: "Projects"
    label_singular: "Project"
    folder: "src/content/projects"
    create: true
    delete: true
    extension: "json"
    format: "json"
    identifier_field: "title"
    summary: "{{title}} — {{type}}"
    fields:
      - { label: "Title",       name: "title",       widget: "string" }
      - { label: "Description", name: "description", widget: "text" }
      - { label: "Type",        name: "type",        widget: "select",
          options: ["PWA","Website"] }
      - { label: "Link",        name: "href",        widget: "string" }
      - { label: "Cover Image", name: "coverImage",  widget: "string", required: false,
          hint: "Use a public image path like /projects/example.svg" }
      - { label: "Featured",   name: "featured",    widget: "boolean", default: false }
      - { label: "Order",      name: "order",       widget: "number",  required: false,
          hint: "Lower values appear earlier in the list." }
      - { label: "Note",        name: "note",        widget: "string", required: false }

  # Pages
  - name: "pages"
    label: "Static Pages"
    label_singular: "Page"
    folder: "src/content/pages"
    create: true
    delete: false
    extension: "md"
    format: "frontmatter"
    identifier_field: "title"
    summary: "{{title}}"
    fields:
      - { label: "Title",       name: "title",       widget: "string" }
      - { label: "Description", name: "description", widget: "text" }
      - { label: "Body",        name: "body",        widget: "markdown" }

  # Blog (English)
  - name: "blog_en"
    label: "Blog (English)"
    label_singular: "Post (English)"
    folder: "src/content/blog/en"
    create: true
    delete: true
    extension: "md"
    format: "frontmatter"
    identifier_field: "title"
    summary: "{{title}} — {{date}}"
    fields:
      - { label: "Title",       name: "title",       widget: "string" }
      - { label: "Description", name: "description", widget: "text" }
      - { label: "Date",        name: "date",        widget: "datetime", default: "", date_format: "YYYY-MM-DD", time_format: false }
      - { label: "Tags",        name: "tags",        widget: "list",      required: false, default: [] }
      - { label: "Featured",    name: "featured",    widget: "boolean",   default: false }
      - { label: "Body",        name: "body",        widget: "markdown" }

  # Blog (Arabic)
  - name: "blog_ar"
    label: "Blog (Arabic)"
    label_singular: "Post (Arabic)"
    folder: "src/content/blog/ar"
    create: true
    delete: true
    extension: "md"
    format: "frontmatter"
    identifier_field: "title"
    summary: "{{title}} — {{date}}"
    fields:
      - { label: "Title",       name: "title",       widget: "string" }
      - { label: "Description", name: "description", widget: "text" }
      - { label: "Date",        name: "date",        widget: "datetime", default: "", date_format: "YYYY-MM-DD", time_format: false }
      - { label: "Tags",        name: "tags",        widget: "list",      required: false, default: [] }
      - { label: "Featured",    name: "featured",    widget: "boolean",   default: false }
      - { label: "Body",        name: "body",        widget: "markdown" }